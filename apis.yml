- aid: auth0:auth0-for-ai-agents
  name: Auth0 for AI Agents
  description: >
    Identity and authorization product line for AI agents. Bundles Token Vault (delegated API credentials
    for Google/GitHub/Slack etc.), asynchronous authorization (human-in-the-loop), Fine-Grained Authorization
    for RAG, and Auth for MCP (Client ID Metadata Registration + On-Behalf-Of Token Exchange + Resource
    Parameter Compatibility Mode). GA as of 2026.
  humanURL: https://auth0.com/ai
  tags:
  - AI Agents
  - MCP
  - Token Vault
  - GenAI
  - RAG
