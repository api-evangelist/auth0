          description: The well-known trusted issuers, comma separated.
          minLength: 1
          maxLength: 255
        created_at:
          type: string
          description: The date and time the template was created.
          default: '2021-01-01T00:00:00Z'
          format: date-time
        updated_at:
          type: string
          description: The date and time the template was created.
          default: '2021-01-01T00:00:00Z'
          format: date-time
    GetVerifiableCredentialTemplateResponseContent:
