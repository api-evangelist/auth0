        source: "from auth0.management import ManagementClient\n\nclient = ManagementClient(\n    domain=\"{YOUR_DOMAIN}\",\n    token=\"<token>\",\n)\n\nclient.actions.versions.get(\n    action_id=\"actionId\",\n    id=\"id\",\n)\n"
      - lang: ruby
