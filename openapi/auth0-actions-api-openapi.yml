        source: "require \"auth0\"\n\nclient = Auth0::Management.new(token: \"<token>\", base_url: \"https://{YOUR_DOMAIN}/api/v2\")\n\nclient.actions.versions.get(\n  action_id: \"actionId\",\n  id: \"id\"\n)\n"
      - lang: typescript
