  /users/{id}/organizations:
    get:
      summary: List user's organizations
      description: 'Retrieve list of the specified user''s current Organization memberships. User must be specified by user ID. For more information, review Auth0 Organizations.


        This endpoint supports two types of pagination:


        - Offset pagination

        - Checkpoint pagination


        Checkpoint pagination must be used if you need to retrieve more than 1000 organizations.


        **Checkpoint Pagination**


        To search by checkpoint, use the following parameters:


        - `from`: Optional id from which to start selection.

        - `take`: The total number of entries to retrieve when using the `from` parameter. Defaults to 50.


        **Note**: The first time you call this endpoint using checkpoint pagination, omit the `from` parameter. If there are more results, a `next` value is included in the response. You can use this for subsequent API calls. When `next` is no longer included in the response, no pages are remaining.'
      tags:
      - Users
      parameters:
      - name: id
        in: path
        description: ID of the user to retrieve the organizations for.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page index of the results to return. First page is 0.
        schema:
          type: integer
          minimum: 0
          maximum: 1000
      - name: per_page
        in: query
        description: Number of results per page. Defaults to 50.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: include_totals
        in: query
        description: Return results inside an object that contains the total result count (true) or as a direct array of results (false, default).
        schema:
          type: boolean
      - name: from
        in: query
        description: Optional Id from which to start selection.
        schema:
          type: string
      - name: take
        in: query
        description: Number of results per page. Defaults to 50.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Organizations successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserOrganizationsResponseContent'
        '400':
          description: Invalid request query string. The message will vary depending on the cause.
