components:
  schemas:
    FlowActionBigqueryInsertRowsParamsData:
      type: object
      additionalProperties: true
      properties: {}
    FlowActionTwilioSendSmsParams:
      type: object
      additionalProperties: false
      required:
      - connection_id
      - from
      - to
      - message
      properties:
        connection_id:
          type: string
          maxLength: 30
          format: flows-vault-connections-id
        from:
          type: string
          maxLength: 50
        to:
          type: string
          maxLength: 50
        message:
          type: string
          maxLength: 1500
    FlowActionEmailVerifyEmail:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - action
      - params
