          type: string
          format: forms-custom-identifier
        alias:
          type: string
          maxLength: 100
        type:
          type: string
          enum:
          - EMAIL
        action:
          type: string
          enum:
          - VERIFY_EMAIL
        allow_failure:
          type: boolean
        mask_output:
          type: boolean
        params:
          $ref: '#/components/schemas/FlowActionEmailVerifyEmailParams'
    FlowActionHubspot:
