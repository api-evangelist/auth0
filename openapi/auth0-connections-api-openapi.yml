      - lang: python
        label: Delete a connection
        source: "from auth0.management import ManagementClient\n\nclient = ManagementClient(\n    domain=\"{YOUR_DOMAIN}\",\n    token=\"<token>\",\n)\n\nclient.connections.delete(\n    id=\"id\",\n)\n"
      - lang: ruby
        label: Delete a connection
