        required: true
        schema:
          $ref: '#/components/schemas/EmailTemplateNameEnum'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailTemplateRequestContent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateEmailTemplateRequestContent'
      responses:
        '200':
          description: Template successfully updated.
