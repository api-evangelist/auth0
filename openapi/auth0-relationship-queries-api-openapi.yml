      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Relationship Queries
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authorization_model_id:
                  type: string
                  example: 01G5JAVJ41T49E9TT3SKVS7X1J
                type:
                  type: string
                  example: document
                relation:
                  type: string
                  example: reader
                user:
                  type: string
                  example: user:anne
                  maxLength: 512
                  minLength: 1
                contextual_tuples:
                  $ref: '#/components/schemas/ContextualTupleKeys'
                context:
                  type: object
                  description: 'Additional request context that will be used to evaluate any ABAC conditions encountered

                    in the query evaluation.'
                consistency:
                  $ref: '#/components/schemas/ConsistencyPreference'
                  description: Controls the consistency preference for this request. Default value is UNSPECIFIED, which will have the same behavior as MINIMIZE_LATENCY.
              required:
              - type
              - relation
              - user
        required: true
components:
  schemas:
    TypedWildcard:
      type: object
      properties:
        type:
          type: string
          example: employee
      description: 'Type bound public access.


        Normally represented using the `<type>:*` syntax


        `employee:*` represents every object of type `employee`, including those not currently present in the system


        See https://openfga.dev/docs/concepts#what-is-type-bound-public-access'
      required:
      - type
    ContextualTupleKeys:
      type: object
      properties:
        tuple_keys:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/TupleKey'
          maxItems: 100
      required:
      - tuple_keys
    UsersetTree:
