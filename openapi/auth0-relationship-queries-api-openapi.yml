          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Relationship Queries
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tuple_key:
                  $ref: '#/components/schemas/ExpandRequestTupleKey'
                authorization_model_id:
                  type: string
                  example: 01G5JAVJ41T49E9TT3SKVS7X1J
                consistency:
                  $ref: '#/components/schemas/ConsistencyPreference'
                  description: Controls the consistency preference for this request. Default value is UNSPECIFIED, which will have the same behavior as MINIMIZE_LATENCY.
                contextual_tuples:
                  $ref: '#/components/schemas/ContextualTupleKeys'
              required:
              - tuple_key
        required: true
  /stores/{store_id}/list-objects:
    post:
      summary: List all objects of the given type that the user has a relation with
      description: 'The ListObjects API returns a list of all the objects of the given type that the user has a relation with.

        To arrive at a result, the API uses: an authorization model, explicit tuples written through the Write API, contextual tuples present in the request, and implicit tuples that exist by virtue of applying set theory (such as `document:2021-budget#viewer@document:2021-budget#viewer`; the set of users who are viewers of `document:2021-budget` are the set of users who are the viewers of `document:2021-budget`).

        An `authorization_model_id` may be specified in the body. If it is not specified, the latest authorization model ID will be used. It is strongly recommended to specify authorization model id for better performance.

        You may also specify `contextual_tuples` that will be treated as regular tuples. Each of these tuples may have an associated `condition`.

        You may also provide a `context` object that will be used to evaluate the conditioned tuples in the system. It is strongly recommended to provide a value for all the input parameters of all the conditions, to ensure that all tuples be evaluated correctly.

        By default, the Check API caches results for a short time to optimize performance. You may specify a value of `HIGHER_CONSISTENCY` for the optional `consistency` parameter in the body to inform the server that higher conisistency is preferred at the expense of increased latency. Consideration should be given to the increased latency if requesting higher consistency.

        The response will contain the related objects in an array in the "objects" field of the response and they will be strings in the object format `:` (e.g. "document:roadmap").

        The number of objects in the response array will be limited by the execution timeout specified in the flag OPENFGA_LIST_OBJECTS_DEADLINE and by the upper bound specified in the flag OPENFGA_LIST_OBJECTS_MAX_RESULTS, whichever is hit first.

        The objects given will not be sorted, and therefore two identical calls can give a given different set of objects.'
      operationId: ListObjects
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListObjectsResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Relationship Queries
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authorization_model_id:
                  type: string
                  example: 01G5JAVJ41T49E9TT3SKVS7X1J
                type:
                  type: string
                  example: document
                relation:
                  type: string
                  example: reader
                user:
                  type: string
                  example: user:anne
                  maxLength: 512
                  minLength: 1
                contextual_tuples:
                  $ref: '#/components/schemas/ContextualTupleKeys'
                context:
                  type: object
                  description: 'Additional request context that will be used to evaluate any ABAC conditions encountered

                    in the query evaluation.'
                consistency:
                  $ref: '#/components/schemas/ConsistencyPreference'
                  description: Controls the consistency preference for this request. Default value is UNSPECIFIED, which will have the same behavior as MINIMIZE_LATENCY.
              required:
              - type
              - relation
              - user
        required: true
  /stores/{store_id}/list-users:
    post:
      summary: List the users matching the provided filter who have a certain relation to a…
      description: 'The ListUsers API returns a list of all the users of a specific type that have a relation to a given object.

        To arrive at a result, the API uses: an authorization model, explicit tuples written through the Write API, contextual tuples present in the request, and implicit tuples that exist by virtue of applying set theory (such as `document:2021-budget#viewer@document:2021-budget#viewer`; the set of users who are viewers of `document:2021-budget` are the set of users who are the viewers of `document:2021-budget`).

        An `authorization_model_id` may be specified in the body. If it is not specified, the latest authorization model ID will be used. It is strongly recommended to specify authorization model id for better performance.

        You may also specify `contextual_tuples` that will be treated as regular tuples. Each of these tuples may have an associated `condition`.

        You may also provide a `context` object that will be used to evaluate the conditioned tuples in the system. It is strongly recommended to provide a value for all the input parameters of all the conditions, to ensure that all tuples be evaluated correctly.

        The response will contain the related users in an array in the "users" field of the response. These results may include specific objects, usersets

        or type-bound public access. Each of these types of results is encoded in its own type and not represented as a string.In cases where a type-bound public access result is returned (e.g. `user:*`), it cannot be inferred that all subjects

        of that type have a relation to the object; it is possible that negations exist and checks should still be queried

        on individual subjects to ensure access to that document.The number of users in the response array will be limited by the execution timeout specified in the flag OPENFGA_LIST_USERS_DEADLINE and by the upper bound specified in the flag OPENFGA_LIST_USERS_MAX_RESULTS, whichever is hit first.

        The returned users will not be sorted, and therefore two identical calls may yield different sets of users.'
      operationId: ListUsers
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Relationship Queries
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authorization_model_id:
                  type: string
                  example: 01G5JAVJ41T49E9TT3SKVS7X1J
                object:
                  $ref: '#/components/schemas/Object'
                  example: document:example
                relation:
                  type: string
                  example: reader
                user_filters:
                  type: array
                  example:
                  - type: user
                  - type: group
                    relation: member
                  items:
                    type: object
                    $ref: '#/components/schemas/UserTypeFilter'
                  description: The type of results returned. Only accepts exactly one value.
                  maxItems: 1
                  minItems: 1
                contextual_tuples:
                  type: array
                  items:
                    type: object
                    $ref: '#/components/schemas/TupleKey'
                  maxItems: 100
                context:
                  type: object
                  description: 'Additional request context that will be used to evaluate any ABAC conditions encountered

                    in the query evaluation.'
                consistency:
                  $ref: '#/components/schemas/ConsistencyPreference'
                  description: Controls the consistency preference for this request. Default value is UNSPECIFIED, which will have the same behavior as MINIMIZE_LATENCY.
              required:
              - object
              - relation
              - user_filters
        required: true
  /stores/{store_id}/streamed-list-objects:
    post:
      summary: Stream all objects of the given type that the user has a relation with
      description: 'The Streamed ListObjects API is very similar to the the ListObjects API, with two differences:

        1. Instead of collecting all objects before returning a response, it streams them to the client as they are collected.

        2. The number of results returned is only limited by the execution timeout specified in the flag OPENFGA_LIST_OBJECTS_DEADLINE.'
      operationId: StreamedListObjects
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/StreamedListObjectsResponse'
                  error:
                    $ref: '#/components/schemas/Status'
                title: Stream result of StreamedListObjectsResponse
        '400':
          description: Request failed due to invalid input.
