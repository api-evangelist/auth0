openapi: 3.2.0
info:
  title: OpenFGA Relationship Queries API
  description: A high performance and flexible authorization/permission engine built for developers and inspired by Google Zanzibar.
  version: 1.x
  contact:
    name: OpenFGA
    url: https://openfga.dev
    email: community@openfga.dev
  license:
    name: Apache-2.0
    url: https://github.com/openfga/openfga/blob/main/LICENSE
tags:
- name: Relationship Queries
paths:
  /stores/{store_id}/batch-check:
    post:
      summary: Send a list of `check` operations in a single request
      description: 'The `BatchCheck` API functions nearly identically to `Check`, but instead of checking a single user-object relationship BatchCheck accepts a list of relationships to check and returns a map containing `BatchCheckItem` response for each check it received.


        An associated `correlation_id` is required for each check in the batch. This ID is used to correlate a check to the appropriate response. It is a string consisting of only alphanumeric characters or hyphens with a maximum length of 36 characters. This `correlation_id` is used to map the result of each check to the item which was checked, so it must be unique for each item in the batch. We recommend using a UUID or ULID as the `correlation_id`, but you can use whatever unique identifier you need as long as it matches this regex pattern: `^[\w\d-]{1,36}$`


        NOTE: The maximum number of checks that can be passed in the `BatchCheck` API is configurable via the OPENFGA_MAX_CHECKS_PER_BATCH_CHECK environment variable. If `BatchCheck` is called using the SDK, the SDK can split the batch check requests for you.


        For more details on how `Check` functions, see the docs for `/check`.


        ### Examples

        #### A BatchCheckRequest

        ```json

        {

        "checks": [

        {

        "tuple_key": {

        "object": "document:2021-budget"

        "relation": "reader",

        "user": "user:anne",

        },

        "contextual_tuples": {...}

        "context": {}

        "correlation_id": "01JA8PM3QM7VBPGB8KMPK8SBD5"

        },

        {

        "tuple_key": {

        "object": "document:2021-budget"

        "relation": "reader",

        "user": "user:bob",

        },

        "contextual_tuples": {...}

        "context": {}

        "correlation_id": "01JA8PMM6A90NV5ET0F28CYSZQ"

        }

        ]

        }

        ```


        Below is a possible response to the above request. Note that the result map''s keys are the `correlation_id` values from the checked items in the request:

        ```json

        {

        "result": {

        "01JA8PMM6A90NV5ET0F28CYSZQ": {

        "allowed": false,

        "error": {"message": ""}

        },

        "01JA8PM3QM7VBPGB8KMPK8SBD5": {

        "allowed": true,

        "error": {"message": ""}

        }

        }

        ```'
      operationId: BatchCheck
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCheckResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Relationship Queries
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checks:
                  type: array
                  items:
                    type: object
                    $ref: '#/components/schemas/BatchCheckItem'
                  minItems: 1
                authorization_model_id:
                  type: string
                  example: 01G5JAVJ41T49E9TT3SKVS7X1J
                consistency:
                  $ref: '#/components/schemas/ConsistencyPreference'
              required:
              - checks
        required: true
  /stores/{store_id}/check:
    post:
      summary: Check whether a user is authorized to access an object
      description: The Check API returns whether a given user has a relationship with a given object in a given store.
      operationId: Check
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Relationship Queries
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tuple_key:
                  $ref: '#/components/schemas/CheckRequestTupleKey'
                contextual_tuples:
                  $ref: '#/components/schemas/ContextualTupleKeys'
                authorization_model_id:
                  type: string
                  example: 01G5JAVJ41T49E9TT3SKVS7X1J
                trace:
                  type: boolean
                  example: false
                  description: Defaults to false. Making it true has performance implications.
                  readOnly: true
                context:
                  type: object
                  description: 'Additional request context that will be used to evaluate any ABAC conditions encountered

                    in the query evaluation.'
                consistency:
                  $ref: '#/components/schemas/ConsistencyPreference'
                  description: Controls the consistency preference for this request. Default value is UNSPECIFIED, which will have the same behavior as MINIMIZE_LATENCY.
              required:
              - tuple_key
        required: true
  /stores/{store_id}/expand:
    post:
      summary: Expand all relationships in userset tree format, and following userset rewrite…
      description: 'The Expand API will return all users and usersets that have certain relationship with an object in a certain store.

        This is different from the `/stores/{store_id}/read` API in that both users and computed usersets are returned.

        Body parameters `tuple_key.object` and `tuple_key.relation` are all required.

        A `contextual_tuples` object may also be included in the body of the request. This object contains one field `tuple_keys`, which is an array of tuple keys. Each of these tuples may have an associated `condition`.

        The response will return a tree whose leaves are the specific users and usersets. Union, intersection and difference operator are located in the intermediate nodes.


        ## Example

        To expand all users that have the `reader` relationship with object `document:2021-budget`, use the Expand API with the following request body

        ```json

        {

        "tuple_key": {

        "object": "document:2021-budget",

        "relation": "reader"

        },

        "authorization_model_id": "01G50QVV17PECNVAHX1GG4Y5NC"

        }

        ```

        OpenFGA''s response will be a userset tree of the users and usersets that have read access to the document.

        ```json

        {

        "tree":{

        "root":{

        "type":"document:2021-budget#reader",

        "union":{

        "nodes":[

        {

        "type":"document:2021-budget#reader",

        "leaf":{

        "users":{

        "users":[

        "user:bob"

        ]

        }

        }

        },

        {

        "type":"document:2021-budget#reader",

        "leaf":{

        "computed":{

        "userset":"document:2021-budget#writer"

        }

        }

        }

        ]

        }

        }

        }

        }

        ```

        The caller can then call expand API for the `writer` relationship for the `document:2021-budget`.

        ### Expand Request with Contextual Tuples


        Given the model

        ```python

        model

        schema 1.1


        type user


        type folder

        relations

        define owner: [user]


        type document

        relations

        define parent: [folder]

        define viewer: [user] or writer

        define writer: [user] or owner from parent

        ```

        and the initial tuples

        ```json

        [{

        "user": "user:bob",

        "relation": "owner",

        "object": "folder:1"

        }]

        ```


        To expand all `writers` of `document:1` when `document:1` is put in `folder:1`, the first call could be


        ```json

        {

        "tuple_key": {

        "object": "document:1",

        "relation": "writer"

        },

        "contextual_tuples": {

        "tuple_keys": [

        {

        "user": "folder:1",

        "relation": "parent",

        "object": "document:1"

        }

        ]

        }

        }

        ```

        this returns:

        ```json

        {

        "tree": {

        "root": {

        "name": "document:1#writer",

        "union": {

        "nodes": [

        {

        "name": "document:1#writer",

        "leaf": {

        "users": {

        "users": []

        }

        }

        },

        {

        "name": "document:1#writer",

        "leaf": {

        "tupleToUserset": {

        "tupleset": "document:1#parent",

        "computed": [

        {

        "userset": "folder:1#owner"

        }

        ]

        }

        }

        }

        ]

        }

        }

        }

        }

        ```

        This tells us that the `owner` of `folder:1` may also be a writer. So our next call could be to find the `owners` of `folder:1`

        ```json

        {

        "tuple_key": {

        "object": "folder:1",

        "relation": "owner"

        }

        }

        ```

        which gives

        ```json

        {

        "tree": {

        "root": {

        "name": "folder:1#owner",

        "leaf": {

        "users": {

        "users": [

        "user:bob"

        ]

        }

        }

        }

        }

        }

        ```'
      operationId: Expand
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandResponse'
        '400':
