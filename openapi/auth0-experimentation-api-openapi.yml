          items:
            $ref: '#/components/schemas/AllocationRequestItem'
        default_config:
          $ref: '#/components/schemas/DefaultConfigEnum'
          description: 'Applies only to Auth0-managed flags. Controls where non-overridden config keys resolve from: ''tenant'' inherits the tenant''s live config, ''flag'' uses the flag''s frozen defaults. Can only be modified on draft experiments. Rejected for customer-defined flags.'
