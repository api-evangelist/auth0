      type: object
      description: Partial update of an experiment. Only provided fields are updated. Providing allocations replaces the entire allocations set.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          description: A human-readable name for the experiment
          minLength: 3
          maxLength: 255
          pattern: ^(?!.*\x00)\S(.*\S)?$
        description:
          description: A description of the experiment
          type:
          - string
          - 'null'
          minLength: 3
          maxLength: 1024
          pattern: ^(?!.*\x00)\S(.*\S)?$
        authentication_flow:
          $ref: '#/components/schemas/AuthenticationFlowEnum'
          description: 'Specifies the target authentication flow for this experiment. This field can only be modified on draft experiments. Must be one of: authentication, mfa_enrollment, mfa_challenge, password_reset, passkey_enrollment, or all. Note that the all value targets every flow at once, but requires that this is the only active experiment.'
