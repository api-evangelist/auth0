  /organizations/search:
    get:
      summary: Search organizations
      description: 'Retrieve details of organizations matching a search criteria. It is possible to:


        - Specify a search criteria for organizations

        - Search via `name`

        - Search via `display_name`

        - Substring matching (`contains` and `ends-with`) requires at least 3 characters

        - Use wildcards


        The `q` query parameter can be used to get organizations that match the specified criteria on `name` OR `display_name`.


        This endpoint supports SCIM or Lucene filter syntax with low-latency, cursor-based pagination. Use the `parser` parameter to specify "scim" or "lucene" syntax (default: "lucene").


        Results are eventually consistent and may not reflect recent updates immediately.


        **Sortable fields:** `name`, `display_name`, `created_at` (ascending only). Defaults to insertion order (oldest first).'
      tags:
      - Organizations
      parameters:
      - name: q
        in: query
        description: 'Filter expression in SCIM or Lucene syntax (depending on parser parameter, default: Lucene). Lucene examples: `name:acme*`, `display_name:*auth*`. SCIM examples: `name eq "Auth0"`, `display_name sw "auth" and created_at gt "2024-01-01"`. SCIM operators: eq, ne, sw, ew, co, pr, gt, ge, lt, le, and, or. <br /><br /><b>Supported Fields</b>:<ul><li><i>id</i> - Organization ID (case-sensitive, exact match)</li><li><i>name</i> - Organization name (supports contains, starts-with, ends-with operators; sortable)</li><li><i>display_name</i> - Organization display name (supports contains, starts-with, ends-with operators; sortable)</li><li><i>created_at</i> - Creation timestamp (supports date range operators; sortable)</li><li><i>metadata.{key}</i> - Filter by organization metadata key-value pairs</li></ul>Maximum 5 filter operations per query. Results are eventually consistent and may not reflect recent updates.'
        schema:
          type: string
          maxLength: 1000
      - name: parser
        in: query
        description: Query parser to use for the filter expression. Use "scim" for SCIM filter syntax or "lucene" for Lucene query syntax (default).
        schema:
          $ref: '#/components/schemas/SearchParserEnum'
      - name: take
        in: query
        description: Maximum number of results to return per page (1-100). Defaults to 50.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: from
        in: query
        description: Cursor for the next page of results. Use the value from the next field in the previous response.
        schema:
          type: string
          maxLength: 1000
      - name: sort
        in: query
        description: Field name to sort results by in ascending order only. Defaults to insertion order (oldest first) if not provided.
        schema:
          $ref: '#/components/schemas/OrganizationSortFieldEnum'
      responses:
        '200':
          description: Organizations successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOrganizationsPaginatedResponseContent'
        '400':
          description: Invalid request query string. The message will vary depending on the cause.
        '401':
          description: Invalid token.
          x-description-1: Invalid signature received for JSON Web Token validation.
          x-description-2: Client is not global.
        '403':
          description: 'Insufficient scope; expected any of: read:organizations.'
        '429':
          description: Too many requests. Check the X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset headers.
        '504':
          description: The search request timed out. Please simplify your query and try again.
      operationId: get_search
