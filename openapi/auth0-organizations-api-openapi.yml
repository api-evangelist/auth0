    delete:
      summary: Delete organization
      description: 'Remove an Organization from your tenant. This action cannot be undone.


        **Note**: Members are automatically disassociated from an Organization when it is deleted. However, this action does **not** delete these users from your tenant.'
      tags:
      - Organizations
      parameters:
      - name: id
        in: path
        description: Organization identifier.
        required: true
        schema:
          type: string
          maxLength: 50
      responses:
        '204':
          description: The organization was deleted.
        '400':
          description: Invalid request URI. The message will vary depending on the cause.
        '401':
          description: Invalid token.
