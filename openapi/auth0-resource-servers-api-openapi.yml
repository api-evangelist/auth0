        token_dialect:
          $ref: '#/components/schemas/ResourceServerTokenDialectResponseEnum'
        token_encryption:
          $ref: '#/components/schemas/ResourceServerTokenEncryption'
        consent_policy:
          $ref: '#/components/schemas/ResourceServerConsentPolicyEnum'
        authorization_details:
