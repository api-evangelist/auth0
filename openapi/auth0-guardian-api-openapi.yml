    delete:
      summary: Delete a multi-factor authentication enrollment
      description: Remove a specific multi-factor authentication (MFA) enrollment from a user's account. This allows the user to re-enroll with MFA. For more information, review Reset User Multi-Factor Authentication and Recovery Codes.
      tags:
      - Guardian
      parameters:
      - name: id
        in: path
        description: ID of the enrollment to be deleted.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Enrollment successfully deleted.
        '400':
          description: Invalid input based on schemas.
        '401':
          description: Token has expired or signature is invalid.
        '403':
          description: Insufficient scope (expected delete:enrollment).
      operationId: delete_enrollments_by_id
      x-release-lifecycle: GA
      x-operation-name: delete
      x-operation-group:
      - guardian
      - enrollments
      security:
      - bearerAuth: []
