components:
  schemas:
    CreateConnectionProfileResponseContent:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ConnectionProfileId'
        name:
          $ref: '#/components/schemas/ConnectionProfileName'
        organization:
          $ref: '#/components/schemas/ConnectionProfileOrganization'
        connection_name_prefix_template:
          $ref: '#/components/schemas/ConnectionNamePrefixTemplate'
        enabled_features:
          $ref: '#/components/schemas/ConnectionProfileEnabledFeatures'
        connection_config:
          $ref: '#/components/schemas/ConnectionProfileConfig'
        strategy_overrides:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverrides'
        provisioning:
          $ref: '#/components/schemas/ConnectionProfileProvisioning'
        cross_app_access_resource_app:
          $ref: '#/components/schemas/ConnectionProfileCrossAppAccessResourceApp'
          x-release-lifecycle: EA
    ConnectionProfileOrganizationAssignMembershipOnLoginEnum:
      type: string
      description: Indicates if membership should be assigned on login.
      enum:
      - none
      - optional
      - required
    ConnectionProfileCrossAppAccessResourceAppStatus:
      type: object
      description: The Cross App Access resource app status configuration.
      additionalProperties: false
      required:
      - default_value
      properties:
        default_value:
          $ref: '#/components/schemas/ConnectionProfileCrossAppAccessResourceAppStatusDefaultValueEnum'
        allowed_values:
          $ref: '#/components/schemas/ConnectionProfileCrossAppAccessResourceAppStatusAllowedValuesEnum'
    ConnectionProfileProvisioningScimTokenMaxAllowedExpiry:
      type:
      - integer
      - 'null'
      description: The maximum SCIM token expiry, in seconds. `null` means there is no maximum.
      minimum: 900
    ConnectionProfileStrategyOverrides:
      type: object
      description: Strategy-specific overrides for this attribute
      additionalProperties: false
      properties:
        pingfederate:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverride'
        ad:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverride'
        adfs:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverride'
        waad:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverride'
        google-apps:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverride'
        okta:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverride'
        oidc:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverride'
        samlp:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverride'
    ConnectionProfileStrategyOverride:
      type: object
      description: Connection Profile Strategy Override
      additionalProperties: false
      properties:
        enabled_features:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverridesEnabledFeatures'
        connection_config:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverridesConnectionConfig'
        provisioning:
          $ref: '#/components/schemas/ConnectionProfileStrategyOverridesProvisioning'
    UpdateConnectionProfileResponseContent:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ConnectionProfileId'
        name:
          $ref: '#/components/schemas/ConnectionProfileName'
        organization:
          $ref: '#/components/schemas/ConnectionProfileOrganization'
        connection_name_prefix_template:
          $ref: '#/components/schemas/ConnectionNamePrefixTemplate'
        enabled_features:
          $ref: '#/components/schemas/ConnectionProfileEnabledFeatures'
        connection_config:
          $ref: '#/components/schemas/ConnectionProfileConfig'
