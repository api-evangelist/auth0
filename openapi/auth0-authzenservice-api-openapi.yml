openapi: 3.2.0
info:
  title: OpenFGA Auth Zen Service API
  description: A high performance and flexible authorization/permission engine built for developers and inspired by Google Zanzibar.
  version: 1.x
  contact:
    name: OpenFGA
    url: https://openfga.dev
    email: community@openfga.dev
  license:
    name: Apache-2.0
    url: https://github.com/openfga/openfga/blob/main/LICENSE
tags:
- name: AuthZenService
paths:
  /.well-known/authzen-configuration/{store_id}:
    get:
      summary: '[Experimental] Get AuthZEN PDP configuration and capabilities'
      description: '[Experimental] The GetConfiguration API returns metadata about the Policy Decision Point (PDP) including its name, version, supported endpoints, and capabilities. This endpoint follows the AuthZEN specification for PDP discovery.


        Following the AuthZEN spec''s multi-tenant pattern, OpenFGA provides a per-store discovery endpoint at `/.well-known/authzen-configuration/{store_id}`. This returns absolute endpoint URLs specific to that store.


        ## Example Response

        ```json

        {

        "policy_decision_point": "https://example.com/stores/01ARZ3NDEKTSV4RRFFQ69G5FAV",

        "access_evaluation_endpoint": "https://example.com/stores/01ARZ3NDEKTSV4RRFFQ69G5FAV/access/v1/evaluation",

        "access_evaluations_endpoint": "https://example.com/stores/01ARZ3NDEKTSV4RRFFQ69G5FAV/access/v1/evaluations",

        "search_subject_endpoint": "https://example.com/stores/01ARZ3NDEKTSV4RRFFQ69G5FAV/access/v1/search/subject",

        "search_resource_endpoint": "https://example.com/stores/01ARZ3NDEKTSV4RRFFQ69G5FAV/access/v1/search/resource",

        "search_action_endpoint": "https://example.com/stores/01ARZ3NDEKTSV4RRFFQ69G5FAV/access/v1/search/action"

        }

        ```'
      operationId: GetConfiguration
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConfigurationResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        description: 'The store ID for which to retrieve configuration.

          Following the AuthZEN spec''s multi-tenant pattern, each store has its own discovery endpoint.'
        in: path
        required: true
        schema:
          type: string
      tags:
      - AuthZenService
  /stores/{store_id}/access/v1/evaluation:
    post:
      summary: '[Experimental] Evaluate whether a subject can perform an action on a resource'
      description: '[Experimental] The Evaluation API determines whether a subject is authorized to perform an action on a resource. This endpoint implements the AuthZEN Access Evaluation API specification.


        ## Request Structure

        The request requires three components:

        - **subject**: The entity requesting access (e.g., a user or service)

        - **action**: The operation being performed (maps to a relation in the authorization model)

        - **resource**: The object being accessed


        Each component has a `type` and `id` field, and may include optional `properties` for ABAC (Attribute-Based Access Control) conditions.


        ## Response

        The response contains a `decision` field (boolean) indicating whether access is permitted, and an optional `context` object with additional information such as the evaluation ID or error details.


        ## ABAC Support

        Properties on subject, action, and resource are automatically merged into the evaluation context with prefixes:

        - Subject properties: `subject_`

        - Resource properties: `resource_`

        - Action properties: `action_`


        These merged properties can be used in conditions defined in your authorization model.


        ## Examples

        ### Basic authorization check

        Check if user Anne can read a document:

        ```json

        {

        "subject": {"type": "user", "id": "anne"},

        "action": {"name": "can_read"},

        "resource": {"type": "document", "id": "roadmap"}

        }

        ```

        Response when authorized:

        ```json

        {

        "decision": true

        }

        ```

        ### Using properties for ABAC

        Check access with subject and resource attributes:

        ```json

        {

        "subject": {

        "type": "user",

        "id": "anne",

        "properties": {"department": "engineering", "clearance_level": 3}

        },

        "action": {"name": "can_read"},

        "resource": {

        "type": "document",

        "id": "secret-project",

        "properties": {"classification": "confidential", "required_clearance": 2}

        }

        }

        ```

        ### Using request context

        Provide additional context for time-based or environmental conditions:

        ```json

        {

        "subject": {"type": "user", "id": "bob"},

        "action": {"name": "can_access"},

        "resource": {"type": "system", "id": "production"},

        "context": {

        "current_time": "2024-01-15T14:30:00Z",

        "ip_address": "192.168.1.100",

        "is_vpn_connected": true

        }

        }

        ```

        ### Specifying authorization model

        Pin the evaluation to a specific authorization model version using the `Openfga-Authorization-Model-Id` header:

        ```

        POST /stores/{store_id}/access/v1/evaluation

        Openfga-Authorization-Model-Id: 01G50QVV17PECNVAHX1GG4Y5NC


        {

        "subject": {"type": "user", "id": "anne"},

        "action": {"name": "can_write"},

        "resource": {"type": "document", "id": "budget-2024"}

        }

        ```'
      operationId: Evaluation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - AuthZenService
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  $ref: '#/components/schemas/Subject'
                resource:
                  $ref: '#/components/schemas/Resource'
                action:
                  $ref: '#/components/schemas/Action'
                context:
                  type: object
              required:
              - subject
              - resource
              - action
        required: true
  /stores/{store_id}/access/v1/evaluations:
    post:
      summary: '[Experimental] Check whether one or more users are authorized to access…'
      description: '[Experimental] The Evaluations API allows batch authorization checks in a single request. It supports request-level defaults for subject, action, resource, and context that can be overridden per evaluation item.


        ## Evaluation Semantics

        The `options.evaluations_semantic` field controls how evaluations are processed:

        - `execute_all` (default): Execute all evaluations and return all results

        - `deny_on_first_deny`: Stop processing on first deny decision

        - `permit_on_first_permit`: Stop processing on first permit decision


        When using `deny_on_first_deny` or `permit_on_first_permit`, the response may include fewer items than the request because processing short-circuits when the condition is met.


        ## Authorization Model Selection

        To pin evaluations to a specific authorization model version, send the `Openfga-Authorization-Model-Id` header. If the header is not provided, the latest model is used.


        ## Examples

        ### Basic batch evaluation

        Check if a user can perform multiple actions on a document:

        ```json

        {

        "subject": {"type": "user", "id": "anne"},

        "resource": {"type": "document", "id": "roadmap"},

        "evaluations": [

        {"action": {"name": "can_read"}},

        {"action": {"name": "can_write"}},

        {"action": {"name": "can_delete"}}

        ]

        }

        ```

        ### Using evaluation semantics

        Stop on first permitted action (useful for finding any valid permission):

        ```json

        {

        "subject": {"type": "user", "id": "anne"},

        "resource": {"type": "document", "id": "roadmap"},

        "evaluations": [

        {"action": {"name": "can_read"}},

        {"action": {"name": "can_write"}}

        ],

        "options": {

        "evaluations_semantic": "permit_on_first_permit"

        }

        }

        ```

        ### Overriding defaults per evaluation

        Check permissions across multiple resources:

        ```json

        {

        "subject": {"type": "user", "id": "anne"},

        "action": {"name": "can_read"},

        "evaluations": [

        {"resource": {"type": "document", "id": "doc1"}},

        {"resource": {"type": "document", "id": "doc2"}},

        {"resource": {"type": "folder", "id": "folder1"}}

        ]

        }

        ```'
      operationId: Evaluations
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationsResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - AuthZenService
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  $ref: '#/components/schemas/Subject'
                action:
                  $ref: '#/components/schemas/Action'
                resource:
                  $ref: '#/components/schemas/Resource'
                context:
                  type: object
                evaluations:
                  type: array
                  items:
                    type: object
                    $ref: '#/components/schemas/EvaluationsItemRequest'
                  description: Optional. If omitted or empty, behaves like a single Access Evaluation request.
                options:
                  $ref: '#/components/schemas/EvaluationsOptions'
                  title: Options for batch evaluation semantics
        required: true
  /stores/{store_id}/access/v1/search/action:
    post:
      summary: '[Experimental] Search for actions a subject can perform on a resource'
      description: '[Experimental] The ActionSearch API returns all actions (relations) that a subject can perform on a specific resource. This is useful for answering questions like "What can Anne do with this document?" or building dynamic UIs that show only the actions a user is permitted to perform.


        ## Examples

        ### Find all actions a user can perform on a document

        ```json

        {

        "subject": {"type": "user", "id": "anne"},

        "resource": {"type": "document", "id": "roadmap"}

        }

        ```

        Response:

        ```json

        {

        "results": [

        {"name": "can_read"},

        {"name": "can_write"},

        {"name": "can_share"}

        ],

        "page": {"count": 3}

        }

        ```

        ### Search with ABAC context for time-based permissions

        ```json

        {

        "subject": {"type": "user", "id": "bob"},

        "resource": {"type": "report", "id": "quarterly-financials"},

        "context": {

        "current_time": "2024-01-15T14:30:00Z",

        "user_department": "finance"

        }

        }

        ```

        ### Paginated action search

        ```json

        {

        "subject": {"type": "user", "id": "admin"},

        "resource": {"type": "system", "id": "production"},

        "page": {"limit": 50}

        }

        ```'
      operationId: ActionSearch
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionSearchResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - AuthZenService
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  $ref: '#/components/schemas/Subject'
                resource:
                  $ref: '#/components/schemas/Resource'
                context:
                  type: object
                page:
                  $ref: '#/components/schemas/PageRequest'
              title: ActionSearch request
              required:
              - subject
              - resource
        required: true
  /stores/{store_id}/access/v1/search/resource:
    post:
      summary: '[Experimental] Search for resources a subject has access to'
      description: '[Experimental] The ResourceSearch API returns all resources of a given type that a subject has a specific action (relation) on. This is useful for answering questions like "What documents can Anne read?" or "What folders can Bob administer?"


        The resource type filter is required. Results support pagination for large result sets.


        ## Examples

        ### Find all documents a user can read

        ```json

        {

        "subject": {"type": "user", "id": "anne"},

        "action": {"name": "can_read"},

        "resource": {"type": "document"}

        }

        ```

        Response:

        ```json

        {

        "results": [

        {"type": "document", "id": "roadmap"},

        {"type": "document", "id": "budget-2024"},

        {"type": "document", "id": "team-roster"}

        ],

        "page": {"count": 3}

        }

        ```

        ### Find folders a user can administer with pagination

        ```json

        {

        "subject": {"type": "user", "id": "bob"},

        "action": {"name": "can_admin"},

        "resource": {"type": "folder"},

        "page": {"limit": 25}

        }

        ```

        ### Search with ABAC context

        ```json

        {

        "subject": {"type": "user", "id": "anne"},

        "action": {"name": "can_read"},

        "resource": {"type": "document"},

        "context": {

        "current_time": "2024-01-15T10:00:00Z",

        "ip_address": "192.168.1.100"

        }

        }

        ```'
      operationId: ResourceSearch
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSearchResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - AuthZenService
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  $ref: '#/components/schemas/Subject'
                action:
                  $ref: '#/components/schemas/Action'
                resource:
                  $ref: '#/components/schemas/ResourceFilter'
                  title: Filter by resource type
                context:
                  type: object
                page:
                  $ref: '#/components/schemas/PageRequest'
              title: ResourceSearch request
              required:
              - subject
              - action
              - resource
        required: true
  /stores/{store_id}/access/v1/search/subject:
    post:
      summary: '[Experimental] Search for subjects with access to a resource'
      description: '[Experimental] The SubjectSearch API returns all subjects that have a specific action (relation) on a given resource. This is useful for answering questions like "Who can read this document?" or "Who can administer this folder?"


        Results can be filtered by subject type and support pagination for large result sets.


        ## Examples

        ### Find all users who can read a document

        ```json

        {

        "resource": {"type": "document", "id": "roadmap"},

        "action": {"name": "can_read"},

        "subject": {"type": "user"}

        }

        ```

        Response:

        ```json

        {

        "results": [

        {"type": "user", "id": "anne"},

        {"type": "user", "id": "bob"},

        {"type": "user", "id": "charlie"}

        ],

        "page": {"count": 3}

        }

        ```

        ### Paginated search with limit

        ```json

        {

        "resource": {"type": "folder", "id": "engineering"},

        "action": {"name": "can_view"},

        "subject": {"type": "user"},

        "page": {"limit": 10}

        }

        ```

        ### Continue from previous page

        ```json

        {

        "resource": {"type": "folder", "id": "engineering"},

        "action": {"name": "can_view"},

        "subject": {"type": "user"},

        "page": {"token": "eyJsYXN0X2lkIjoiMTAwIn0=", "limit": 10}

        }

        ```'
      operationId: SubjectSearch
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectSearchResponse'
        '400':
          description: Request failed due to invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessageResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Request failed due to incorrect path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathUnknownErrorMessageResponse'
        '409':
          description: Request was aborted due a transaction conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortedMessageResponse'
        '422':
          description: Request timed out due to excessive request throttling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableContentMessageResponse'
        '500':
          description: Request failed due to internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessageResponse'
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - AuthZenService
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resource:
                  $ref: '#/components/schemas/Resource'
                action:
                  $ref: '#/components/schemas/Action'
                subject:
                  $ref: '#/components/schemas/SubjectFilter'
                  description: REQUIRED by AuthZEN Subject Search. Subject `id` may be provided but is ignored.
                context:
                  type: object
                page:
                  $ref: '#/components/schemas/PageRequest'
              title: SubjectSearch request
              required:
              - resource
              - action
              - subject
        required: true
components:
  schemas:
    EvaluationResponse:
      type: object
      properties:
        decision:
          type: boolean
        context:
          type: object
    SubjectFilter:
      type: object
      properties:
        type:
          type: string
          example: user
        id:
          type: string
          description: Optional subject id. If present in Subject Search, it is ignored per AuthZEN spec.
        properties:
          type: object
      title: SubjectFilter is used for search operations where only type is required
      required:
      - type
    UnprocessableContentErrorCode:
      type: string
      enum:
      - no_throttled_error_code
      - throttled_timeout_error
      default: no_throttled_error_code
    ForbiddenResponse:
      type: object
      example:
        code: forbidden
        message: the principal is not authorized to perform the action
      properties:
        code:
          $ref: '#/components/schemas/AuthErrorCode'
        message:
          type: string
    EvaluationsOptions:
      type: object
      properties:
        evaluations_semantic:
          $ref: '#/components/schemas/EvaluationsSemantic'
          title: Controls how batch evaluations are processed
      title: Options for batch evaluations
    Subject:
      type: object
      properties:
        type:
          type: string
          example: user
        id:
          type: string
          example: anne
        properties:
          type: object
      required:
      - type
      - id
    EvaluationsSemantic:
      type: string
      enum:
      - execute_all
      - deny_on_first_deny
      - permit_on_first_permit
      default: execute_all
      description: "- execute_all: Execute all evaluations (default behavior)\n - deny_on_first_deny: Stop on first deny decision\n - permit_on_first_permit: Stop on first permit decision"
      title: Enum for evaluation semantics
    GetConfigurationResponse:
      type: object
      properties:
        policy_decision_point:
          type: string
          description: REQUIRED. The PDP identifier URL (HTTPS, no query or fragment).
        access_evaluation_endpoint:
          type: string
          description: REQUIRED. The access evaluation endpoint URL.
        access_evaluations_endpoint:
          type: string
          description: OPTIONAL. The batch evaluations endpoint URL.
        search_subject_endpoint:
          type: string
          description: OPTIONAL. The subject search endpoint URL.
        search_resource_endpoint:
          type: string
          description: OPTIONAL. The resource search endpoint URL.
        search_action_endpoint:
          type: string
          description: OPTIONAL. The action search endpoint URL.
        capabilities:
          type: array
          items:
            type: string
          description: OPTIONAL. Supported capabilities as URN strings.
        signed_metadata:
          type: string
          description: OPTIONAL. Signed metadata JWT per AuthZEN metadata specification.
      title: GetConfiguration response - PDP metadata per AuthZEN spec
      required:
      - policy_decision_point
      - access_evaluation_endpoint
    InternalErrorCode:
      type: string
      enum:
      - no_internal_error
      - internal_error
      - deadline_exceeded
      - already_exists
      - resource_exhausted
      - failed_precondition
      - aborted
      - out_of_range
      - unavailable
      - data_loss
      default: no_internal_error
    UnprocessableContentMessageResponse:
      type: object
      example:
        code: throttled_timeout_error
        message: timeout due to throttling on complex request
      properties:
        code:
          $ref: '#/components/schemas/UnprocessableContentErrorCode'
        message:
          type: string
    ResourceFilter:
      type: object
      properties:
        type:
          type: string
          example: document
        id:
          type: string
          description: Optional resource id. If present in Resource Search, it is ignored per AuthZEN spec.
        properties:
          type: object
      title: ResourceFilter is used for search operations where only type is required
      required:
      - type
    AuthErrorCode:
      type: string
      enum:
      - no_auth_error
      - auth_failed_invalid_subject
      - auth_failed_invalid_audience
      - auth_failed_invalid_issuer
      - invalid_claims
      - auth_failed_invalid_bearer_token
      - bearer_token_missing
      - unauthenticated
      - forbidden
      default: no_auth_error
    InternalErrorMessageResponse:
      type: object
      example:
        code: internal_error
        message: Internal Server Error
      properties:
        code:
          $ref: '#/components/schemas/InternalErrorCode'
        message:
          type: string
    ActionSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Action'
        page:
          $ref: '#/components/schemas/PageResponse'
          title: Optional per AuthZEN spec - omit if pagination not supported
    AbortedMessageResponse:
      type: object
      example:
        code: '10'
        message: transaction conflict
      properties:
        code:
          type: string
        message:
          type: string
    PageRequest:
      type: object
      properties:
        token:
          type: string
          title: Continuation token from previous response
        limit:
          type: integer
          format: int64
          title: 'Maximum number of results to return (default: 50, max: 1000)'
      title: Pagination request parameters for search operations
    UnauthenticatedResponse:
      type: object
      example:
        code: unauthenticated
        message: unauthenticated
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    Action:
      type: object
      properties:
        name:
          type: string
          example: can_read
        properties:
          type: object
      required:
      - name
    NotFoundErrorCode:
      type: string
      enum:
      - no_not_found_error
      - undefined_endpoint
      - store_id_not_found
      - unimplemented
      default: no_not_found_error
    EvaluationsResponse:
      type: object
      properties:
        evaluations:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/EvaluationResponse'
    ErrorCode:
      type: string
      enum:
      - no_error
      - validation_error
      - authorization_model_not_found
      - authorization_model_resolution_too_complex
      - invalid_write_input
      - cannot_allow_duplicate_tuples_in_one_request
      - cannot_allow_duplicate_types_in_one_request
      - cannot_allow_multiple_references_to_one_relation
      - invalid_continuation_token
      - invalid_tuple_set
      - invalid_check_input
      - invalid_expand_input
      - unsupported_user_set
      - invalid_object_format
      - write_failed_due_to_invalid_input
      - authorization_model_assertions_not_found
      - latest_authorization_model_not_found
      - type_not_found
      - relation_not_found
      - empty_relation_definition
      - invalid_user
      - invalid_tuple
      - unknown_relation
      - store_id_invalid_length
      - assertions_too_many_items
      - id_too_long
      - authorization_model_id_too_long
      - tuple_key_value_not_specified
      - tuple_keys_too_many_or_too_few_items
      - page_size_invalid
      - param_missing_value
      - difference_base_missing_value
      - subtract_base_missing_value
      - object_too_long
      - relation_too_long
      - type_definitions_too_few_items
      - type_invalid_length
      - type_invalid_pattern
      - relations_too_few_items
      - relations_too_long
      - relations_invalid_pattern
      - object_invalid_pattern
      - query_string_type_continuation_token_mismatch
      - exceeded_entity_limit
      - invalid_contextual_tuple
      - duplicate_contextual_tuple
      - invalid_authorization_model
      - unsupported_schema_version
      - cancelled
      - invalid_start_time
      default: no_error
    Resource:
      type: object
      properties:
        type:
          type: string
          example: document
        id:
          type: string
          example: roadmap
        properties:
          type: object
      required:
      - type
      - id
    PathUnknownErrorMessageResponse:
      type: object
      example:
        code: undefined_endpoint
        message: Endpoint not enabled
      properties:
        code:
          $ref: '#/components/schemas/NotFoundErrorCode'
        message:
          type: string
    SubjectSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Subject'
        page:
          $ref: '#/components/schemas/PageResponse'
          title: Optional per AuthZEN spec - omit if pagination not supported
    ResourceSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Resource'
        page:
          $ref: '#/components/schemas/PageResponse'
          title: Optional per AuthZEN spec - omit if pagination not supported
    ValidationErrorMessageResponse:
      type: object
      example:
        code: validation_error
        message: Generic validation error
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    PageResponse:
      type: object
      properties:
        next_token:
          type: string
          title: Token to retrieve next page (empty if no more results)
        count:
          type: integer
          format: int64
          title: Number of results in this page
        total:
          type: integer
          format: int64
          title: Total number of results (if known, otherwise 0)
      title: Pagination response parameters
    EvaluationsItemRequest:
      type: object
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        resource:
          $ref: '#/components/schemas/Resource'
        action:
          $ref: '#/components/schemas/Action'
        context:
          type: object
