      - type: object
        additionalProperties: true
      - type: object
        additionalProperties: true
      - type: object
        additionalProperties: true
      additionalProperties: false
      properties:
        multiline:
          type: boolean
        default_value:
          type: string
          minLength: 1
        placeholder:
          type: string
          minLength: 1
          maxLength: 500
        min_length:
          type: integer
          minimum: 1
        max_length:
          type: integer
          minimum: 1
    FormStyleNullable:
      oneOf:
      - $ref: '#/components/schemas/FormStyle'
      - type: 'null'
    FormFieldPaymentConfigFields:
      type: object
      additionalProperties: false
      properties:
        card_number:
          $ref: '#/components/schemas/FormFieldPaymentConfigFieldProperties'
        expiration_date:
          $ref: '#/components/schemas/FormFieldPaymentConfigFieldProperties'
        security_code:
          $ref: '#/components/schemas/FormFieldPaymentConfigFieldProperties'
        trustmarks:
          type: boolean
    FormBlockImageConfig:
      type: object
      additionalProperties: false
      required:
      - src
      properties:
        src:
          type: string
          maxLength: 500
        position:
          $ref: '#/components/schemas/FormBlockImageConfigPositionEnum'
        height:
          type: number
          minimum: 1
          maximum: 500
    FormMessagesCustom:
      type: object
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 255
    ListFormsOffsetPaginatedResponseContent:
      type: object
      additionalProperties: false
      properties:
        start:
          type: number
        limit:
          type: number
        total:
          type: number
        forms:
          type: array
          items:
            $ref: '#/components/schemas/FormSummary'
    FormComponentCategoryWidgetConst:
      type: string
      enum:
      - WIDGET
    FormFieldCards:
      type: object
      additionalProperties: false
      required:
      - id
      - category
      - type
      properties:
        id:
          type: string
