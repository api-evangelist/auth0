          type: string
          minLength: 1
    FormRouterConfig:
      type: object
      additionalProperties: false
      properties:
        rules:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FormRouterRule'
        fallback:
          $ref: '#/components/schemas/FormNodePointer'
    FormNodeTypeStepConst:
      type: string
      enum:
      - STEP
    FormNodeListNullable:
      oneOf:
      - $ref: '#/components/schemas/FormNodeList'
      - type: 'null'
    FormLanguages:
      type: object
      additionalProperties: false
      properties:
        primary:
          type: string
          minLength: 1
          maxLength: 55
        default:
          type: string
          minLength: 1
          maxLength: 55
    FormFieldTypeBooleanConst:
      type: string
      enum:
      - BOOLEAN
    FormRouter:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      properties:
        id:
          type: string
          format: forms-custom-identifier
        type:
          $ref: '#/components/schemas/FormNodeTypeRouterConst'
        coordinates:
          $ref: '#/components/schemas/FormNodeCoordinates'
        alias:
          type: string
          minLength: 1
          maxLength: 150
        config:
          $ref: '#/components/schemas/FormRouterConfig'
    FormTranslations:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
    FormFieldTel:
      type: object
      additionalProperties: false
      required:
      - id
      - category
      - type
      properties:
        id:
          type: string
          format: forms-custom-identifier
        category:
          $ref: '#/components/schemas/FormComponentCategoryFieldConst'
        type:
          $ref: '#/components/schemas/FormFieldTypeTelConst'
        config:
          $ref: '#/components/schemas/FormFieldTelConfig'
        label:
          type: string
          minLength: 1
        hint:
          type: string
          minLength: 1
          maxLength: 500
        required:
          type: boolean
        sensitive:
          type: boolean
    FormStepConfig:
      type: object
      additionalProperties: false
      properties:
        components:
          $ref: '#/components/schemas/FormStepComponentList'
        next_node:
