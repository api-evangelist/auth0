    FormStyle:
      type: object
      additionalProperties: false
      properties:
        css:
          type: string
          minLength: 1
          maxLength: 5000
    FormBlockResendButtonConfig:
      type: object
      additionalProperties: false
      required:
      - active_text
      - button_text
      - waiting_text
      - flow_id
      properties:
        active_text:
          type: string
          minLength: 1
          maxLength: 255
        button_text:
          type: string
          minLength: 1
          maxLength: 255
        waiting_text:
          type: string
          minLength: 1
          maxLength: 255
        text_alignment:
          $ref: '#/components/schemas/FormBlockResendButtonConfigTextAlignmentEnum'
        flow_id:
          type: string
          maxLength: 30
          format: flow-id
        max_attempts:
          type: number
          minimum: 1
          maximum: 10
        waiting_time:
          type: number
          minimum: 1
          maximum: 60
    FormFieldDateConfigFormatEnum:
      type: string
      enum:
      - DATE
      - TIME
    FormWidgetRecaptchaConfig:
      type: object
      additionalProperties: false
      required:
      - site_key
      - secret_key
      properties:
        site_key:
          type: string
          minLength: 1
        secret_key:
          type: string
          minLength: 1
    FormWidgetRecaptcha:
      type: object
      additionalProperties: false
      required:
      - id
      - category
      - type
      - config
      properties:
        id:
          type: string
          format: forms-custom-identifier
        category:
          $ref: '#/components/schemas/FormComponentCategoryWidgetConst'
        type:
          $ref: '#/components/schemas/FormWidgetTypeRecaptchaConst'
        config:
          $ref: '#/components/schemas/FormWidgetRecaptchaConfig'
        label:
          type: string
          minLength: 1
        hint:
          type: string
          minLength: 1
          maxLength: 500
        required:
          type: boolean
