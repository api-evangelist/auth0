        label:
          type: string
          minLength: 1
        hint:
          type: string
          minLength: 1
          maxLength: 500
        required:
          type: boolean
        sensitive:
          type: boolean
    FormStartNodeNullable:
      oneOf:
      - $ref: '#/components/schemas/FormStartNode'
      - type: 'null'
    FormFieldTelConfigStrings:
      type: object
      additionalProperties: false
      properties:
        filter_placeholder:
          type: string
          minLength: 1
    FormFieldTypeNumberConst:
      type: string
      enum:
      - NUMBER
    FormFieldTypeFileConst:
      type: string
      enum:
      - FILE
    FormBlockTypeImageConst:
      type: string
      enum:
      - IMAGE
    FormComponentCategoryBlockConst:
      type: string
