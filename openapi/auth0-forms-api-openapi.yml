    FormFieldTypeLegalConst:
      type: string
      enum:
      - LEGAL
    FormBlockTypeRichTextConst:
      type: string
      enum:
      - RICH_TEXT
    FormStepComponentList:
      type: array
      items:
        $ref: '#/components/schemas/FormComponent'
    FormWidgetAuth0VerifiableCredentials:
      type: object
      additionalProperties: false
      required:
      - id
      - category
      - type
      - config
      properties:
        id:
          type: string
          format: forms-custom-identifier
        category:
          $ref: '#/components/schemas/FormComponentCategoryWidgetConst'
        type:
          $ref: '#/components/schemas/FormWidgetTypeAuth0VerifiableCredentialsConst'
        config:
          $ref: '#/components/schemas/FormWidgetAuth0VerifiableCredentialsConfig'
        label:
          type: string
          minLength: 1
        hint:
          type: string
          minLength: 1
          maxLength: 500
        required:
          type: boolean
        sensitive:
          type: boolean
    FormFieldTypeTelConst:
      type: string
      enum:
      - TEL
    FormFieldCustom:
      type: object
      additionalProperties: false
      required:
      - id
      - category
      - type
      - config
      properties:
        id:
          type: string
          format: forms-custom-identifier
        category:
          $ref: '#/components/schemas/FormComponentCategoryFieldConst'
        type:
          $ref: '#/components/schemas/FormFieldTypeCustomConst'
        config:
          $ref: '#/components/schemas/FormFieldCustomConfig'
        label:
          type: string
          minLength: 1
        hint:
          type: string
          minLength: 1
          maxLength: 500
        required:
          type: boolean
        sensitive:
          type: boolean
    FormBlockJumpButtonConfig:
      type: object
      additionalProperties: false
      required:
      - text
      - next_node
      properties:
        text:
          type: string
          maxLength: 150
        next_node:
          $ref: '#/components/schemas/FormNodePointer'
        style:
          $ref: '#/components/schemas/FormBlockJumpButtonConfigStyle'
    FormFieldLegal:
      type: object
      additionalProperties: false
      required:
      - id
      - category
      - type
      properties:
        id:
          type: string
          format: forms-custom-identifier
        category:
          $ref: '#/components/schemas/FormComponentCategoryFieldConst'
        type:
          $ref: '#/components/schemas/FormFieldTypeLegalConst'
        config:
          $ref: '#/components/schemas/FormFieldLegalConfig'
        label:
          type: string
          minLength: 1
        hint:
          type: string
          minLength: 1
          maxLength: 500
        required:
          type: boolean
        sensitive:
          type: boolean
    FormComponent:
      type: object
      oneOf:
      - $ref: '#/components/schemas/FormBlock'
      - $ref: '#/components/schemas/FormWidget'
      - $ref: '#/components/schemas/FormField'
    FormFieldTypeCustomConst:
      type: string
      enum:
      - CUSTOM
    FormFieldCardsConfig:
      type: object
      additionalProperties: false
      properties:
        hide_labels:
          type: boolean
        multiple:
          type: boolean
        options:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FormFieldCardsConfigOption'
        default_value: {}
    FormWidgetTypeGMapsAddressConst:
      type: string
      enum:
      - GMAPS_ADDRESS
    FormBlockTypeDividerConst:
      type: string
      enum:
      - DIVIDER
    FormBlockHtmlConfig:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          maxLength: 10000
    FormFieldTypeTextConst:
      type: string
      enum:
      - TEXT
    GetFormResponseContent:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - created_at
      - updated_at
      properties:
        id:
          type: string
          maxLength: 30
          format: form-id
        name:
          type: string
          minLength: 1
          maxLength: 150
        messages:
          $ref: '#/components/schemas/FormMessages'
        languages:
