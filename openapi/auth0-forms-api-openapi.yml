          $ref: '#/components/schemas/FormSummary'
      - $ref: '#/components/schemas/ListFormsOffsetPaginatedResponseContent'
    FormFieldEmail:
      type: object
      additionalProperties: false
      required:
      - id
      - category
      - type
      properties:
        id:
          type: string
          format: forms-custom-identifier
        category:
          $ref: '#/components/schemas/FormComponentCategoryFieldConst'
        type:
          $ref: '#/components/schemas/FormFieldTypeEmailConst'
        config:
          $ref: '#/components/schemas/FormFieldEmailConfig'
        label:
          type: string
          minLength: 1
        hint:
          type: string
          minLength: 1
          maxLength: 500
        required:
          type: boolean
        sensitive:
          type: boolean
    FormFieldPaymentConfigCredentials:
      type: object
      additionalProperties: false
      required:
      - public_key
      - private_key
      properties:
        public_key:
          type: string
          minLength: 1
          maxLength: 250
        private_key:
          type: string
          minLength: 1
          maxLength: 250
    FormWidgetTypeAuth0VerifiableCredentialsConst:
      type: string
      enum:
      - AUTH0_VERIFIABLE_CREDENTIALS
    FormFieldUrlConfig:
      type: object
      additionalProperties: false
      properties:
        default_value:
          type: string
          minLength: 1
        placeholder:
          type: string
          minLength: 1
          maxLength: 500
    FormBlockRichTextConfig:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          maxLength: 10000
    FormFieldFileConfigCategoryEnum:
      type: string
      enum:
      - AUDIO
      - VIDEO
      - IMAGE
      - DOCUMENT
      - ARCHIVE
    FormFieldPaymentConfigChargeOneOffOneOff:
      type: object
      additionalProperties: true
      required:
      - amount
      - currency
      properties:
        amount:
          $ref: '#/components/schemas/FormFieldPaymentConfigChargeOneOffOneOffAmount'
        currency:
          $ref: '#/components/schemas/FormFieldPaymentConfigChargeOneOffCurrencyEnum'
    FormFieldText:
      type: object
      additionalProperties: false
      required:
      - id
      - category
      - type
      properties:
        id:
          type: string
          format: forms-custom-identifier
        category:
          $ref: '#/components/schemas/FormComponentCategoryFieldConst'
        type:
          $ref: '#/components/schemas/FormFieldTypeTextConst'
        config:
          $ref: '#/components/schemas/FormFieldTextConfig'
        label:
          type: string
          minLength: 1
        hint:
          type: string
          minLength: 1
          maxLength: 500
        required:
          type: boolean
        sensitive:
          type: boolean
    FormFieldLegalConfig:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
    FormEndingNodeResumeFlowTrueConst:
      type: boolean
      enum:
      - true
    FormFieldChoice:
      type: object
      additionalProperties: false
      required:
      - id
      - category
      - type
      properties:
        id:
          type: string
          format: forms-custom-identifier
        category:
          $ref: '#/components/schemas/FormComponentCategoryFieldConst'
        type:
          $ref: '#/components/schemas/FormFieldTypeChoiceConst'
        config:
