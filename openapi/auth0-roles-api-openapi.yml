    delete:
      summary: Delete a role
      description: Delete a specific user role from your tenant. Once deleted, it is removed from any user who was previously assigned that role. This action cannot be undone.
      tags:
      - Roles
      parameters:
      - name: id
        in: path
        description: ID of the role to delete.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Role successfully deleted.
        '400':
          description: Invalid request URI. The message will vary depending on the cause.
        '401':
          description: Invalid token.
          x-description-1: Invalid signature received for JSON Web Token validation.
        '403':
          description: 'Insufficient scope; expected: delete:roles.'
        '404':
          description: Role not found.
        '429':
          description: Too many requests. Check the X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset headers.
