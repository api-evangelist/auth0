openapi: 3.2.0
info:
  title: Auth0 Management Client Profiles API
  description: Auth0 Management API v2.
  termsOfService: https://auth0.com/web-terms/
  contact:
    name: Auth0 Support
    url: https://support.auth0.com
  version: '2.0'
servers:
- url: https://{tenantDomain}/api/v2
  variables:
    tenantDomain:
      default: '{TENANT}.auth0.com'
      description: Auth0 Tenant Domain
security:
- bearerAuth: []
tags:
- name: client-profiles
paths:
  /client-profiles:
    get:
      summary: List client profiles
      description: 'Retrieve a paginated list of client profiles for the tenant. Uses checkpoint pagination: pass the next cursor from a previous response as the from query parameter to retrieve the following page.'
      tags:
      - client-profiles
      parameters:
      - $ref: '#/components/parameters/FromParameter'
      - $ref: '#/components/parameters/ClientProfilesTakeParameter'
      responses:
        '200':
          $ref: '#/components/responses/ListClientProfiles'
        '400':
          description: Invalid request query string. The message will vary depending on the cause.
        '401':
          description: Invalid token.
        '403':
          description: 'Insufficient scope; expected any of: read:client_profiles'
        '429':
          description: Too many requests. Check the X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset headers.
      operationId: get_client_profiles
      x-release-lifecycle: EA
      x-operation-name: list
      x-operation-group: clientProfiles
      x-operation-request-parameters-name: ListClientProfilesRequestParameters
      security:
      - bearerAuth: []
      - oAuth2ClientCredentials:
        - read:client_profiles
      x-codeSamples: []
    post:
      summary: Create a client profile
      description: Create a client profile. At most one profile is allowed per tenant in this release; attempting to create a second returns 409 Conflict. The profile governs Dynamic CIMD clients matched by its apply_policy at runtime.
      tags:
      - client-profiles
      requestBody:
        $ref: '#/components/requestBodies/CreateClientProfile'
      responses:
        '201':
          $ref: '#/components/responses/CreateClientProfile'
        '400':
          description: Invalid request body. The message will vary depending on the cause.
        '401':
          description: Invalid token.
        '403':
          description: 'Insufficient scope; expected any of: create:client_profiles'
        '409':
          description: A client profile already exists for this tenant.
        '429':
          description: Too many requests. Check the X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset headers.
      operationId: post_client_profile
      x-release-lifecycle: EA
      x-operation-name: create
      x-operation-group: clientProfiles
      security:
      - bearerAuth: []
      - oAuth2ClientCredentials:
        - create:client_profiles
      x-codeSamples: []
  /client-profiles/{id}:
    get:
      summary: Get a client profile
      description: Retrieve a single client profile by its identifier. Returns 404 if no profile with the given ID exists for the tenant.
      tags:
      - client-profiles
      parameters:
      - $ref: '#/components/parameters/ClientProfileIdParameter'
      responses:
        '200':
          $ref: '#/components/responses/GetClientProfile'
        '400':
          description: Invalid request query string. The message will vary depending on the cause.
        '401':
          description: Invalid token.
        '403':
          description: 'Insufficient scope; expected any of: read:client_profiles'
        '404':
          description: Client profile not found.
        '429':
          description: Too many requests. Check the X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset headers.
      operationId: get_client_profile
      x-release-lifecycle: EA
      x-operation-name: get
      x-operation-group: clientProfiles
      x-operation-request-parameters-name: GetClientProfileRequestParameters
      security:
      - bearerAuth: []
      - oAuth2ClientCredentials:
        - read:client_profiles
      x-codeSamples: []
    delete:
      summary: Delete a client profile
      description: 'Delete a client profile. Idempotent: returns 204 No Content whether or not a profile with the given ID existed. Deleting the profile removes fleet governance for matched clients immediately.'
      tags:
      - client-profiles
      parameters:
      - $ref: '#/components/parameters/ClientProfileIdParameter'
      responses:
        '204':
          $ref: '#/components/responses/DeleteClientProfile'
        '400':
          description: Invalid request query string. The message will vary depending on the cause.
        '401':
          description: Invalid token.
        '403':
          description: 'Insufficient scope; expected any of: delete:client_profiles'
        '429':
          description: Too many requests. Check the X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset headers.
      operationId: delete_client_profile
      x-release-lifecycle: EA
      x-operation-name: delete
      x-operation-group: clientProfiles
      security:
      - bearerAuth: []
      - oAuth2ClientCredentials:
        - delete:client_profiles
      x-codeSamples: []
    patch:
      summary: Update a client profile
      description: Update a client profile. Supports partial updates at the top level (JSON Merge Patch); omitted top-level fields remain unchanged. Nested objects such as client_configuration must be supplied in full.
      tags:
      - client-profiles
      parameters:
      - $ref: '#/components/parameters/ClientProfileIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/UpdateClientProfile'
      responses:
        '200':
          $ref: '#/components/responses/UpdateClientProfile'
        '400':
          description: Invalid request body. The message will vary depending on the cause.
        '401':
          description: Invalid token.
        '403':
          description: 'Insufficient scope; expected any of: update:client_profiles'
        '404':
          description: Client profile not found.
        '429':
          description: Too many requests. Check the X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset headers.
      operationId: patch_client_profile
      x-release-lifecycle: EA
      x-operation-name: update
      x-operation-group: clientProfiles
      security:
      - bearerAuth: []
      - oAuth2ClientCredentials:
        - update:client_profiles
      x-codeSamples: []
components:
  schemas:
    UpdateClientProfileRequestContent:
      type: object
      description: 'Top-level JSON Merge Patch (RFC 7386): omitted top-level fields remain unchanged. Nested objects such as client_configuration must be supplied in full.'
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/ClientProfileName'
        description:
          $ref: '#/components/schemas/ClientProfileDescription'
        client_configuration:
          $ref: '#/components/schemas/ClientProfileClientConfiguration'
        apply_policy:
          $ref: '#/components/schemas/ClientProfileApplyPolicy'
    ClientProfileClientConfigurationOrganizationDiscoveryMethods:
      type: object
      description: Default organization discovery methods applied to matched clients.
      additionalProperties: false
      properties:
        default_value:
          type: array
          items:
            $ref: '#/components/schemas/ClientProfileClientConfigurationOrganizationDiscoveryMethodEnum'
    CreateClientProfileRequestContent:
      type: object
      additionalProperties: false
      required:
      - name
      - client_configuration
      - apply_policy
      properties:
        name:
          $ref: '#/components/schemas/ClientProfileName'
        description:
          $ref: '#/components/schemas/ClientProfileDescription'
        client_configuration:
          $ref: '#/components/schemas/ClientProfileClientConfiguration'
        apply_policy:
          $ref: '#/components/schemas/ClientProfileApplyPolicy'
    ClientProfileRefreshTokenTokenLifetime:
      type: object
      description: Default refresh token lifetime, in seconds, applied to matched clients.
      additionalProperties: false
      properties:
        default_value:
          type: integer
          minimum: 1
          maximum: 31557600
    ClientProfileClientConfigurationRefreshToken:
      type: object
      description: Refresh token settings. Omit any sub-field to use the client's own value.
      additionalProperties: false
      properties:
        token_lifetime:
          $ref: '#/components/schemas/ClientProfileRefreshTokenTokenLifetime'
        idle_token_lifetime:
          $ref: '#/components/schemas/ClientProfileRefreshTokenIdleTokenLifetime'
        leeway:
          $ref: '#/components/schemas/ClientProfileRefreshTokenLeeway'
    ClientProfileApplyPolicyExternalMetadataCreatedByEnum:
      type: string
      description: The external metadata client's creator to match. The value <code>client</code> indicates the client was registered dynamically.
      enum:
      - client
    ClientProfileName:
      type: string
      description: Display name of the client profile.
      minLength: 1
      maxLength: 128
      pattern: ^[^\u0000]*$
    ClientProfileApplyPolicyExternalMetadataTypeEnum:
      type: string
      description: The client's type of external metadata to match. The value <code>cimd</code> identifies clients registered via a Client ID Metadata Document.
      enum:
      - cimd
    ClientProfile:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - client_configuration
      - apply_policy
      properties:
        id:
          $ref: '#/components/schemas/ClientProfileId'
        name:
          $ref: '#/components/schemas/ClientProfileName'
        description:
          $ref: '#/components/schemas/ClientProfileDescription'
        client_configuration:
          $ref: '#/components/schemas/ClientProfileClientConfiguration'
        apply_policy:
          $ref: '#/components/schemas/ClientProfileApplyPolicy'
        created_at:
          type: string
          description: Timestamp of creation.
          format: date-time
        updated_at:
          type: string
          description: Timestamp of last update.
          format: date-time
    ClientProfileApplyPolicy:
      type: object
      description: Runtime matching rules that determine which clients this profile governs.
      additionalProperties: false
      required:
      - external_metadata_type
      - external_metadata_created_by
      properties:
        external_metadata_type:
          $ref: '#/components/schemas/ClientProfileApplyPolicyExternalMetadataTypeEnum'
        external_metadata_created_by:
          $ref: '#/components/schemas/ClientProfileApplyPolicyExternalMetadataCreatedByEnum'
    ClientProfileId:
      type: string
      description: Client Profile identifier.
      format: client-profile-id
    ClientProfileDescription:
      type:
      - string
      - 'null'
      description: Optional description of the client profile.
      maxLength: 256
      pattern: ^[^\u0000]*$
    ClientProfileClientConfigurationOrganizationRequireBehaviorEnum:
      type: string
      description: When an organization is required, how matched clients prompt for it.
      enum:
      - no_prompt
      - pre_login_prompt
      - post_login_prompt
    ClientProfileClientConfiguration:
      type: object
      description: Runtime policy applied to matched clients. Omitted fields fall back to each client's own setting.
      additionalProperties: false
      properties:
        refresh_token:
          $ref: '#/components/schemas/ClientProfileClientConfigurationRefreshToken'
        organization_usage:
          $ref: '#/components/schemas/ClientProfileClientConfigurationOrganizationUsage'
        organization_require_behavior:
          $ref: '#/components/schemas/ClientProfileClientConfigurationOrganizationRequireBehavior'
        organization_discovery_methods:
          $ref: '#/components/schemas/ClientProfileClientConfigurationOrganizationDiscoveryMethods'
        require_proof_of_possession:
          $ref: '#/components/schemas/ClientProfileClientConfigurationRequireProofOfPossession'
    ClientProfileClientConfigurationRequireProofOfPossession:
      type: object
      description: Whether matched clients default to requiring proof of possession.
      additionalProperties: false
      properties:
        default_value:
          type: boolean
    ClientProfileClientConfigurationOrganizationDiscoveryMethodEnum:
      type: string
      description: A method used to discover a user's organization.
      enum:
      - email
      - organization_name
    ClientProfileClientConfigurationOrganizationUsageEnum:
      type: string
      description: How matched clients handle organizations.
      enum:
      - deny
      - allow
      - require
    ClientProfileClientConfigurationOrganizationUsage:
      type: object
      description: Default organization usage applied to matched clients.
      additionalProperties: false
      properties:
        default_value:
          $ref: '#/components/schemas/ClientProfileClientConfigurationOrganizationUsageEnum'
    ClientProfileRefreshTokenIdleTokenLifetime:
      type: object
      description: Default idle refresh token lifetime, in seconds, applied to matched clients.
      additionalProperties: false
      properties:
        default_value:
          type: integer
          minimum: 1
          maximum: 31557600
    ClientProfileRefreshTokenLeeway:
      type: object
      description: Default refresh token rotation leeway, in seconds, applied to matched clients.
      additionalProperties: false
      properties:
        default_value:
          type: integer
          minimum: 0
    ClientProfileClientConfigurationOrganizationRequireBehavior:
      type: object
      description: Default organization prompt behavior applied to matched clients.
      additionalProperties: false
      properties:
        default_value:
          $ref: '#/components/schemas/ClientProfileClientConfigurationOrganizationRequireBehaviorEnum'
    ListClientProfilesPaginatedResponseContent:
      type: object
      description: Checkpoint paginated list of client profiles.
      additionalProperties: false
      required:
      - client_profiles
      properties:
        next:
          type: string
          description: A cursor to be used as the "from" query parameter for the next page of results.
        client_profiles:
          type: array
          items:
            $ref: '#/components/schemas/ClientProfile'
  responses:
    CreateClientProfile:
      description: Client profile successfully created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientProfile'
    GetClientProfile:
      description: Record for existing client profile.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientProfile'
    ListClientProfiles:
      description: Client profiles successfully retrieved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListClientProfilesPaginatedResponseContent'
    DeleteClientProfile:
      description: Client profile successfully deleted.
    UpdateClientProfile:
      description: Client profile successfully updated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientProfile'
  requestBodies:
    CreateClientProfile:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateClientProfileRequestContent'
    UpdateClientProfile:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateClientProfileRequestContent'
  parameters:
    ClientProfilesTakeParameter:
      name: take
      in: query
      description: Number of results per page. Defaults to 50.
      schema:
        type: integer
        description: Number of results per page. Defaults to 50.
        minimum: 1
        default: 50
      x-merge-priority: 5
    FromParameter:
      name: from
      in: query
      description: Optional Id from which to start selection.
      schema:
        type: string
        description: Optional Id from which to start selection.
      x-merge-priority: 5
    ClientProfileIdParameter:
      name: id
      in: path
      description: ID of the client profile.
      required: true
      schema:
        $ref: '#/components/schemas/ClientProfileId'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: jwt
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token/
          x-form-parameters:
            audience: /api/v2/
