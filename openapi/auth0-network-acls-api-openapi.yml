components:
  schemas:
    NetworkAclsResponseContent:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        description:
          type: string
        active:
          type: boolean
        priority:
          type: number
          minimum: 1
          maximum: 100
        rule:
          $ref: '#/components/schemas/NetworkAclRule'
        created_at:
          type: string
          description: The timestamp when the Network ACL Configuration was created
        updated_at:
          type: string
          description: The timestamp when the Network ACL Configuration was last updated
    NetworkAclActionLogEnum:
      type: boolean
      description: Indicates the rule will log requests that either match or not_match specific criteria
      enum:
      - true
    SetNetworkAclRequestContent:
      type: object
      additionalProperties: false
      required:
      - description
      - active
      - rule
      properties:
        description:
          type: string
          maxLength: 255
        active:
          type: boolean
          description: Indicates whether or not this access control list is actively being used
        priority:
          type: number
          description: Indicates the order in which the ACL will be evaluated relative to other ACL rules.
          default: 50
          minimum: 1
          maximum: 100
        rule:
          $ref: '#/components/schemas/NetworkAclRule'
    NetworkAclActionBlockEnum:
      type: boolean
      description: Indicates the rule will block requests that either match or not_match specific criteria
      enum:
      - true
    UpdateNetworkAclRequestContent:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 255
        active:
          type: boolean
          description: Indicates whether or not this access control list is actively being used
        priority:
          type: number
          description: Indicates the order in which the ACL will be evaluated relative to other ACL rules.
          minimum: 1
          maximum: 100
        rule:
          $ref: '#/components/schemas/NetworkAclRule'
    ListNetworkAclsOffsetPaginatedResponseContent:
      type: object
      additionalProperties: false
      properties:
        network_acls:
          type: array
          items:
            $ref: '#/components/schemas/NetworkAclsResponseContent'
        start:
          type: number
        limit:
          type: number
        total:
          type: number
    NetworkAclActionAllowEnum:
      type: boolean
      description: Indicates the rule will allow requests that either match or not_match specific criteria
      enum:
      - true
    NetworkAclRule:
      type: object
      additionalProperties: false
      required:
      - action
      - scope
      properties:
        action:
          $ref: '#/components/schemas/NetworkAclAction'
        match:
          $ref: '#/components/schemas/NetworkAclMatch'
        not_match:
          $ref: '#/components/schemas/NetworkAclMatch'
        match_all:
          $ref: '#/components/schemas/NetworkAclRuleMatchAllEnum'
        scope:
          $ref: '#/components/schemas/NetworkAclRuleScopeEnum'
    NetworkACLMatchIpv6Cidr:
      type: string
      oneOf:
      - type: string
        format: ipv6
      - type: string
        format: ipv6_cidr
    NetworkACLMatchConnectingIpv6Cidr:
      type: string
      oneOf:
      - type: string
        format: ipv6
      - type: string
        format: ipv6_cidr
    SetNetworkAclsResponseContent:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        description:
          type: string
        active:
          type: boolean
        priority:
          type: number
          minimum: 1
          maximum: 100
        rule:
          $ref: '#/components/schemas/NetworkAclRule'
        created_at:
          type: string
          description: The timestamp when the Network ACL Configuration was created
        updated_at:
          type: string
          description: The timestamp when the Network ACL Configuration was last updated
    NetworkAclActionRedirectEnum:
      type: boolean
      description: Indicates the rule will redirect requests that either match or not_match specific criteria
      enum:
      - true
    NetworkAclAction:
      type: object
      additionalProperties: false
      properties:
        block:
          $ref: '#/components/schemas/NetworkAclActionBlockEnum'
        allow:
          $ref: '#/components/schemas/NetworkAclActionAllowEnum'
        log:
          $ref: '#/components/schemas/NetworkAclActionLogEnum'
        redirect:
          $ref: '#/components/schemas/NetworkAclActionRedirectEnum'
        redirect_uri:
          type: string
          description: The URI to which the match or not_match requests will be routed
          minLength: 1
          maxLength: 2000
    NetworkAclHttpMessageSignatureKeys:
      type: array
      description: The keys whose signatures satisfy this rule. Each id references a key that was already created via `POST /api/v2/keys/network-acls`.
      minItems: 1
      items:
        $ref: '#/components/schemas/NetworkAclHttpMessageSignatureKey'
    NetworkAclRuleScopeEnum:
      type: string
      description: Identifies the origin of the request as the Management API (management), Authentication API (authentication), Dynamic Client Registration API (dynamic_client_registration), or any (tenant)
      enum:
      - management
      - authentication
      - tenant
      - dynamic_client_registration
    ListNetworkAclsResponseContent:
      oneOf:
      - $ref: '#/components/schemas/ListNetworkAclsOffsetPaginatedResponseContent'
      - type: array
        items:
          $ref: '#/components/schemas/NetworkAclsResponseContent'
    NetworkAclRuleMatchAllEnum:
      type: boolean
      description: When true, the rule unconditionally matches all traffic regardless of any other signals. Mutually exclusive with `match` and `not_match`.
      enum:
      - true
    NetworkAclHttpMessageSignature:
      type: object
      description: HTTP Message Signature configuration.
      additionalProperties: false
      required:
      - keys
      properties:
        keys:
          $ref: '#/components/schemas/NetworkAclHttpMessageSignatureKeys'
    CreateNetworkAclRequestContent:
      type: object
      additionalProperties: false
      required:
      - description
      - active
      - rule
      properties:
        description:
          type: string
          maxLength: 255
        active:
          type: boolean
          description: Indicates whether or not this access control list is actively being used
        priority:
          type: number
          description: Indicates the order in which the ACL will be evaluated relative to other ACL rules.
          default: 50
          minimum: 1
          maximum: 100
        rule:
          $ref: '#/components/schemas/NetworkAclRule'
    UpdateNetworkAclResponseContent:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        description:
          type: string
        active:
          type: boolean
        priority:
          type: number
          minimum: 1
          maximum: 100
        rule:
          $ref: '#/components/schemas/NetworkAclRule'
        created_at:
          type: string
          description: The timestamp when the Network ACL Configuration was created
        updated_at:
          type: string
          description: The timestamp when the Network ACL Configuration was last updated
    NetworkAclHttpMessageSignatureKey:
      type: object
      additionalProperties: false
      required:
      - id
      properties:
        id:
          type: string
          description: Auth0-generated identifier for the key, as returned by `POST /api/v2/keys/network-acls`.
          pattern: ^key_[1-9A-HJ-NP-Za-km-z]{16,22}$
    NetworkAclMatch:
      type: object
      additionalProperties: false
      properties:
        asns:
          type: array
          minItems: 1
          items:
            type: integer
        auth0_managed:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^auth0\.[^\.\s]+$
        geo_country_codes:
          type: array
          minItems: 1
          items:
            type: string
        geo_subdivision_codes:
          type: array
          minItems: 1
          items:
            type: string
        ipv4_cidrs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NetworkACLMatchIpv4Cidr'
        ipv6_cidrs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NetworkACLMatchIpv6Cidr'
        ja3_fingerprints:
          type: array
          minItems: 1
          items:
            type: string
        ja4_fingerprints:
          type: array
          minItems: 1
          items:
            type: string
        user_agents:
          type: array
          minItems: 1
          items:
            type: string
        hostnames:
          type: array
          minItems: 1
          items:
            type: string
            format: hostname
        connecting_ipv4_cidrs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NetworkACLMatchConnectingIpv4Cidr'
        connecting_ipv6_cidrs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NetworkACLMatchConnectingIpv6Cidr'
        http_message_signature:
          $ref: '#/components/schemas/NetworkAclHttpMessageSignature'
    NetworkACLMatchConnectingIpv4Cidr:
      type: string
      oneOf:
      - type: string
        format: ipv4
      - type: string
        format: cidr
    GetNetworkAclsResponseContent:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        description:
          type: string
        active:
          type: boolean
        priority:
          type: number
          minimum: 1
          maximum: 100
        rule:
          $ref: '#/components/schemas/NetworkAclRule'
        created_at:
          type: string
          description: The timestamp when the Network ACL Configuration was created
        updated_at:
          type: string
          description: The timestamp when the Network ACL Configuration was last updated
    NetworkACLMatchIpv4Cidr:
      type: string
      oneOf:
      - type: string
        format: ipv4
      - type: string
        format: cidr
